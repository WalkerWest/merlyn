<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="shortcut icon" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@400;500&display=swap" rel="stylesheet">
  <title>Regularis Dynamic Content — Regularis Systems</title>
  <meta name="robots" content="noindex">
  <style>
    :root{--bg1:#FFFFFF;--bg2:#F5F4EF;--t1:#1C1C1A;--t2:#6B6A65;--t3:#9B9A95;--b1:rgba(0,0,0,0.09);--b2:rgba(0,0,0,0.18);--r1:8px;--r2:12px;}
    *{box-sizing:border-box;margin:0;padding:0;}
    h1,h2,h3,h4{font-family:'Zilla Slab',Georgia,serif;}
    html,body{height:100%;}
    /* Same treatment as the homepage splash: the photograph under a deep-green
       gradient, with #085041 as the fallback if the image never arrives. Fixed
       The page itself does not scroll, so no fixed attachment is needed. */
    body{padding-top:56px;overflow-x:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
      background-image:linear-gradient(rgba(8,80,65,0.78),rgba(5,50,40,0.88)),url('https://images.unsplash.com/photo-1568515045052-f9a854d70bfd?w=1600&q=80&fit=crop&crop=center');
      background-color:#085041;background-size:cover;background-position:center;
      color:#E1F5EE;line-height:1.5;display:flex;flex-direction:column;}
    .inner{max-width:960px;margin:0 auto;padding:0 32px;width:100%;}

    /* ---- nav ---- */
    .sn{border-bottom:0.5px solid var(--b1);position:fixed;top:0;left:0;right:0;z-index:100;background:#CCE8D8;-webkit-transform:translate3d(0,0,0);transform:translate3d(0,0,0);isolation:isolate;backface-visibility:hidden;}
    .sn .inner{display:flex;align-items:center;justify-content:space-between;padding-top:14px;padding-bottom:14px;}
    .logo{display:flex;align-items:center;gap:9px;font-family:'Zilla Slab',Georgia,serif;font-size:18px;font-weight:500;color:#0F6E56;letter-spacing:-0.2px;text-decoration:none;}
    .logo svg{width:22px;height:22px;flex-shrink:0;display:block;}
    .logo em{font-style:normal;color:var(--t3);font-weight:400;}
    .snl{display:flex;gap:18px;list-style:none;}
    .snl a{font-size:13px;color:var(--t2);text-decoration:none;}
    .snl a:hover{color:var(--t1);}
    .snl a.nav-active{color:var(--t1);font-weight:500;border-bottom:2px solid #1D9E75;padding-bottom:1px;}
    .sncta{font-size:13px;padding:8px 16px;background:#0F6E56;color:#fff;border:none;border-radius:var(--r1);cursor:pointer;text-decoration:none;}
    .sncta:hover{background:#085041;}
    .hamburger{display:none;flex-direction:column;gap:5px;cursor:pointer;padding:4px;border:none;background:transparent;outline:none;}
    .hamburger span{display:block;width:22px;height:2px;background:var(--t2);border-radius:2px;transition:all .2s;}
    .hamburger.open span:nth-child(1){transform:translateY(7px) rotate(45deg);}
    .hamburger.open span:nth-child(2){opacity:0;}
    .hamburger.open span:nth-child(3){transform:translateY(-7px) rotate(-45deg);}

    /* ---- the embed ----
       Full-bleed rather than inside the 960px content column. What loads in here
       is whatever the Desk backend serves, and a presentation needs roughly
       1200px before its own layout stops overflowing; boxing it into the column
       guaranteed a horizontal scrollbar no matter how wide the window was. */
    .frame-head{padding:16px 24px 12px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;}
    .frame-head h1{font-size:19px;font-weight:500;letter-spacing:-0.2px;color:#FFFFFF;}
    .frame-head .head-right{display:flex;align-items:center;gap:16px;}
    .frame-head a{font-size:12.5px;color:#9FE1CB;text-decoration:none;}
    .frame-head a:hover{color:#FFFFFF;text-decoration:underline;}
    .maxbtn{font-size:12.5px;color:#E1F5EE;background:rgba(255,255,255,0.08);border:0.5px solid rgba(159,225,203,0.45);border-radius:var(--r1);padding:6px 12px;cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;gap:6px;}
    .maxbtn:hover{background:rgba(255,255,255,0.18);border-color:#9FE1CB;color:#FFFFFF;}
    .maxbtn:focus-visible{outline:2px solid #9FE1CB;outline-offset:2px;}
    .maxbtn svg{width:13px;height:13px;}

    .frame-wrap{flex:1;min-height:0;padding:0 24px 20px;display:flex;flex-direction:column;}
    /* A pale ring and a lifted shadow so the white framed page reads as a panel
       sitting on the photograph rather than a hole punched through it. */
    .frame-box{flex:1;min-height:460px;border:1px solid rgba(159,225,203,0.35);border-radius:var(--r2);background:#fff;overflow:hidden;box-shadow:0 10px 36px rgba(0,0,0,0.3);}
    .frame-box iframe{width:100%;height:100%;border:0;display:block;}

    .frame-note{font-size:12.5px;color:#9FE1CB;margin-top:12px;line-height:1.6;}
    .frame-note a{color:#FFFFFF;text-decoration:underline;text-underline-offset:2px;}
    .frame-note a:hover{color:#9FE1CB;}

    /* ---- maximized: the frame takes the whole viewport, the site gets out of
       the way. Not the Fullscreen API: that hides the browser chrome too, and a
       presenter usually still wants their tabs and address bar. */
    body.maximized{padding-top:0;overflow:hidden;}
    body.maximized .sn,
    body.maximized .frame-head,
    body.maximized .frame-note{display:none;}
    body.maximized .frame-wrap{position:fixed;inset:0;padding:0;z-index:300;}
    body.maximized .frame-box{border:0;border-radius:0;min-height:0;}
    .restore{display:none;position:fixed;top:12px;right:14px;z-index:310;font-size:12px;
      background:rgba(28,28,26,0.72);color:#fff;border:0;border-radius:100px;padding:7px 14px;
      cursor:pointer;font-family:inherit;align-items:center;gap:7px;backdrop-filter:blur(4px);}
    .restore:hover{background:rgba(28,28,26,0.92);}
    .restore svg{width:12px;height:12px;}
    body.maximized .restore{display:inline-flex;}

    @media(max-width:780px) and (min-width:681px){
      .snl{gap:8px;}
      .snl a{font-size:11.5px;}
    }
    @media(max-width:680px){
      .hamburger{display:flex;}
      .snl{display:none;flex-direction:column;position:absolute;top:100%;left:0;right:0;background:#CCE8D8;border-top:0.5px solid rgba(0,0,0,0.1);border-bottom:0.5px solid rgba(0,0,0,0.1);z-index:200;padding:0;margin:0;}
      .snl.open{display:block;}
      .snl li{display:block;width:100%;height:48px;overflow:hidden;}
      .snl li+li{border-top:0.5px solid rgba(0,0,0,0.08);}
      .snl a{display:block;height:48px;line-height:48px;padding:0 24px;font-size:14px;color:var(--t1);}
      .sncta{font-size:12px;padding:6px 12px;margin-left:auto;margin-right:12px;}
      .sn .inner{justify-content:flex-start;}
      .inner{padding:0 22px;}
    }
  </style>
</head>
<body>

  <nav class="sn">
    <div class="inner">
      <a href="index.html" class="logo">
        <svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <rect width="32" height="32" rx="6" fill="#085041"/>
          <rect x="7" y="5" width="1.6" height="22" rx="0.8" fill="#9FE1CB"/>
          <rect x="11.5" y="7" width="9" height="3" rx="1.5" fill="#FAC775"/>
          <rect x="11.5" y="12.5" width="15.5" height="3" rx="1.5" fill="#1D9E75"/>
          <rect x="11.5" y="18" width="12" height="3" rx="1.5" fill="#1D9E75"/>
          <rect x="11.5" y="23.5" width="15.5" height="3" rx="1.5" fill="#1D9E75"/>
        </svg>
        regularis <em>systems</em>
      </a>
      <ul class="snl">
        <li><a href="services.html">Services</a></li>
        <li><a href="desk.html" class="nav-active">Desk</a></li>
        <li><a href="bench.html">Bench</a></li>
        <li><a href="academy.html">Academy</a></li>
        <li><a href="teamiq.html">TeamIQ</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="partnership.html">Partnership</a></li>
      </ul>
      <a href="contact.html" class="sncta">Get started ↗</a>
      <button class="hamburger" aria-label="Toggle menu"><span></span><span></span><span></span></button>
    </div>
  </nav>

  <div class="frame-head">
    <h1>Regularis Dynamic Content</h1>
    <div class="head-right">
      <a href="desk.html">&larr; About Desk</a>
      <button type="button" class="maxbtn" id="maximize" aria-label="Expand to full window">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/>
        </svg>
        Full window
      </button>
    </div>
  </div>

  <div class="frame-wrap">
    <div class="frame-box">
      <iframe id="desk-frame"
              src="https://overlay-backend-861109469186.us-central1.run.app/admin/signin"
              title="Regularis Dynamic Content"
              referrerpolicy="no-referrer"
              allow="clipboard-write"></iframe>
    </div>
    <p class="frame-note">Not appearing above?
      <a href="https://overlay-backend-861109469186.us-central1.run.app/admin/signin" target="_blank" rel="noopener">Open it in a new tab ↗</a>
      &nbsp;·&nbsp; No workspace yet? <a href="contact.html?interest=desk">Request access</a>.</p>
  </div>

  <button type="button" class="restore" id="restore" aria-label="Exit full window">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M4 14h6v6M20 10h-6V4M14 10l7-7M10 14l-7 7"/>
    </svg>
    Exit full window <span style="opacity:.6;">Esc</span>
  </button>

<script>
  document.querySelector('.hamburger').addEventListener('click',function(){
    this.classList.toggle('open');
    document.querySelector('.snl').classList.toggle('open');
  });

  // A frame refused by X-Frame-Options or frame-ancestors cannot be detected
  // reliably from the parent document - the load event fires either way and the
  // document is unreadable in both cases. So rather than guess wrong in one
  // direction or the other, the escape hatch is simply always present below the
  // frame. It costs one line of text and is never misleading.

  // Full window. The frame covers the viewport and the site chrome is hidden,
  // which is also what gives an embedded presentation enough width to stop
  // overflowing its own layout.
  (function () {
    var body = document.body;
    function on()  { body.classList.add('maximized'); document.getElementById('restore').focus(); }
    function off() { body.classList.remove('maximized'); document.getElementById('maximize').focus(); }

    document.getElementById('maximize').addEventListener('click', on);
    document.getElementById('restore').addEventListener('click', off);

    // Esc is the expected way out, but it only reaches us while focus is in this
    // document - once the visitor clicks into the frame, keystrokes belong to the
    // framed page and we never see them. Hence a visible button as well.
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && body.classList.contains('maximized')) off();
    });
  })();
</script>
</body>
</html>
